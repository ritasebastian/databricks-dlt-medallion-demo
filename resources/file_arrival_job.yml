# File arrival job: deploy after configuring the landing volume.
# If Free Edition rejects trigger configuration, deploy the pipeline alone
# and run it manually or use a supported schedule.
resources:
  jobs:
    orders_file_arrival_job:
      name: orders_file_arrival_job
      trigger:
        pause_status: UNPAUSED
        file_arrival:
          url: /Volumes/main/dlt_orders_demo/landing/orders/
          min_time_between_triggers_seconds: 60
          wait_after_last_change_seconds: 60
      tasks:
        - task_key: run_medallion_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_orders_pipeline.id}
            full_refresh: false
